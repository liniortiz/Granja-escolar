details.guide{border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 15px}.guide summary{padding:15px 0;cursor:pointer;font-weight:800}.guide-content{padding:0 0 15px;color:#4f5d56;line-height:1.6}.guide-content b{color:var(--ink)}
.check-list{display:grid;gap:8px}.check{display:flex;gap:9px;align-items:flex-start}.check::before{content:'✓';width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-weight:900;flex:none}.health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.health-card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}.health-card h3{font-size:17px;margin-bottom:8px}
.quiz-q{border:1px solid var(--line);border-radius:16px;padding:17px;background:#fbfdfb}.quiz-opt{display:block;margin-top:9px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.quiz-opt:hover{background:var(--mint)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cfdcd5;border-radius:15px}.footer-note{margin-top:22px;color:var(--muted);font-size:12px}

</style></head><body><div id="app"></div><script>const STORAGE_KEY='granja_informativa_local_v2';
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x)return x}catch(e){}const seed={"users":[{"id":1,"name":"Usuario de la granja","email":"usuario@granja.local","role":"admin"}],"tasks":[{"id":1,"title":"Alimentar pollo","description":"Suministrar el alimento correspondiente y registrar la cantidad.","assigned_to":1,"task_date":"2026-08-16","status":"completed","completed_by":2,"completed_at":"2026-08-16T16:20:13.518Z"}],"feedings":[{"id":1,"animal":"pollo","feeding_date":"2026-08-16","slot":"morning","amount":4,"student_id":1}],"weights":[{"id":1,"animal":"pollo","days":10,"initial_weight":50,"current_weight":250,"feed_amount":100,"student_id":1,"recorded_at":"2026-08-16T16:24:05.986Z"}],"financial":[{"id":1,"type":"expense","category":"Alimento","description":"purina de engorde","date":"2026-08-16","value":100.01,"user_id":1},{"id":2,"type":"expense","category":"Alimento","description":"maiz","date":"2026-08-16","value":52.01,"user_id":1},{"id":3,"type":"income","category":"Venta de pollo","description":"pollo","date":"2026-08-16","value":19.01,"user_id":1}],"guides":[{"id":1,"name":"Gramera / báscula","purpose":"Medir el peso de animales o alimento.","materials":"Báscula limpia, recipiente.","steps":"1. Enciende y verifica cero.\n2. Coloca el recipiente y tara.\n3. Coloca la muestra.\n4. Registra el resultado.","safety":"Colócala en una superficie estable y seca.","errors":"No tarar el recipiente o mover la báscula durante la medición."},{"id":2,"name":"Termómetro","purpose":"Registrar la temperatura según el protocolo de la granja.","materials":"Termómetro, hoja de registro.","steps":"1. Verifica que esté limpio.\n2. Ubica el sensor según el equipo.\n3. Espera una lectura estable.\n4. Registra fecha y hora.","safety":"Evita golpes y sigue las instrucciones del fabricante.","errors":"Leer demasiado rápido o usarlo en una zona distinta a la definida."}],"quiz_results":[{"id":1,"score":4,"total":4,"topic":"Granja Informativa","user_id":1,"created_at":"2026-08-16T16:29:25.573Z"},{"id":2,"score":4,"total":4,"topic":"Granja Informativa","user_id":1,"created_at":"2026-08-16T16:29:32.950Z"},{"id":3,"score":4,"total":4,"topic":"Granja Informativa","user_id":1,"created_at":"2026-08-16T17:20:48.717Z"},{"id":4,"score":4,"total":4,"topic":"Granja Informativa","user_id":1,"created_at":"2026-08-16T17:20:57.784Z"}],"settings":[{"animal":"pollo","rate":0,"slot_morning":0.4,"slot_noon":0.3,"slot_afternoon":0.3},{"animal":"pez","rate":0,"slot_morning":0.4,"slot_noon":0.3,"slot_afternoon":0.3}]};localStorage.setItem(STORAGE_KEY,JSON.stringify(seed));return seed}
let localDB=loadLocal();
const saveLocal=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(localDB));
const nextId=a=>a.length?Math.max(...a.map(x=>Number(x.id)||0))+1:1;
function clone(x){return JSON.parse(JSON.stringify(x))}
async function api(url,opt={}){
  const method=(opt.method||'GET').toUpperCase();
  let body={}; try{body=opt.body?JSON.parse(opt.body):{}}catch{}
  const fail=(msg)=>{throw Error(msg)};
  if(url==='/api/dashboard'){
    const t=new Date().toISOString().slice(0,10), pending=localDB.tasks.filter(x=>x.status==='pending').length;
    const feed=localDB.feedings.filter(x=>x.feeding_date===t).reduce((a,x)=>a+Number(x.amount||0),0);
    const income=localDB.financial.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.value||0),0);
    const expense=localDB.financial.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.value||0),0);
    return {tasks:pending,feedToday:feed,income,expense,profit:income-expense};
  }
  if(url==='/api/session') return {user:state.user};
  if(url==='/api/logout') return {ok:true};
  if(url==='/api/users') return clone(localDB.users);
  if(url==='/api/settings') return clone(localDB.settings);
  if(url==='/api/tasks'&&method==='GET') return clone(localDB.tasks).sort((a,b)=>String(b.task_date).localeCompare(String(a.task_date))).map(t=>({...t,assigned_name:localDB.users.find(x=>x.id===t.assigned_to)?.name||null,completed_name:localDB.users.find(x=>x.id===t.completed_by)?.name||null}));
  if(url==='/api/tasks'&&method==='POST'){
    if(!body.title||!body.task_date) return fail('Título y fecha son obligatorios.');
    localDB.tasks.push({id:nextId(localDB.tasks),title:body.title,description:body.description||'',assigned_to:body.assigned_to?Number(body.assigned_to):1,task_date:body.task_date,status:'pending',completed_by:null,completed_at:null});saveLocal();return {ok:true};
  }
  let m=url.match(/^\/api\/tasks\/(\d+)\/complete$/);if(m&&method==='PATCH'){const x=localDB.tasks.find(x=>x.id==m[1]);if(!x)return fail('Tarea no encontrada.');x.status='completed';x.completed_by=1;x.completed_at=new Date().toISOString();saveLocal();return {ok:true}}
  m=url.match(/^\/api\/tasks\/(\d+)$/);if(m&&method==='DELETE'){localDB.tasks=localDB.tasks.filter(x=>x.id!=m[1]);saveLocal();return {ok:true}}
  if(url==='/api/feedings'&&method==='GET')return clone(localDB.feedings).slice(-200).reverse().map(x=>({...x,student_name:'Usuario de la granja'}));
  if(url==='/api/feedings'&&method==='POST'){if(!['pollo','pez'].includes(body.animal)||!['morning','noon','afternoon'].includes(body.slot)||!body.feeding_date||!(Number(body.amount)>0))return fail('Datos de alimentación inválidos.');localDB.feedings.push({id:nextId(localDB.feedings),animal:body.animal,feeding_date:body.feeding_date,slot:body.slot,amount:Number(body.amount),student_id:1});saveLocal();return {ok:true}}
  m=url.match(/^\/api\/settings\/(pollo|pez)$/);if(m&&method==='PUT'){const s=localDB.settings.find(x=>x.animal===m[1]);Object.assign(s,{rate:Number(body.rate),slot_morning:Number(body.slot_morning),slot_noon:Number(body.slot_noon),slot_afternoon:Number(body.slot_afternoon)});saveLocal();return {ok:true}}
  if(url==='/api/weights'&&method==='GET')return clone(localDB.weights).slice(-200).reverse().map(x=>({...x,student_name:'Usuario de la granja'}));
  if(url==='/api/weights'&&method==='POST'){if(!['pollo','pez'].includes(body.animal)||Number(body.days)<0||Number(body.initial_weight)<=0)return fail('Datos de crecimiento inválidos. El peso debe registrarse en gramos.');localDB.weights.push({id:nextId(localDB.weights),animal:body.animal,days:Number(body.days),initial_weight:Number(body.initial_weight),current_weight:body.current_weight?Number(body.current_weight):null,feed_amount:Number(body.feed_amount||0),student_id:1,recorded_at:new Date().toISOString()});saveLocal();return {ok:true}}
  if(url==='/api/financial'&&method==='GET')return clone(localDB.financial).slice(-200).reverse().map(x=>({...x,user_name:'Usuario de la granja'}));
  if(url==='/api/financial'&&method==='POST'){if(!['income','expense'].includes(body.type)||!body.category||!body.date||!(Number(body.value)>0))return fail('Datos financieros inválidos.');localDB.financial.push({id:nextId(localDB.financial),type:body.type,category:body.category,description:body.description||'',date:body.date,value:Number(body.value),user_id:1});saveLocal();return {ok:true}}
  m=url.match(/^\/api\/financial\/(\d+)$/);if(m&&method==='DELETE'){localDB.financial=localDB.financial.filter(x=>x.id!=m[1]);saveLocal();return {ok:true}}
  if(url==='/api/guides'&&method==='GET')return clone(localDB.guides);
  if(url==='/api/guides'&&method==='POST'){if(!body.name)return fail('El nombre es obligatorio.');localDB.guides.push({id:nextId(localDB.guides),name:body.name,purpose:body.purpose||'',materials:body.materials||'',steps:body.steps||'',safety:body.safety||'',errors:body.errors||''});saveLocal();return {ok:true}}
  if(url==='/api/quiz-results'&&method==='POST'){localDB.quiz_results.push({id:nextId(localDB.quiz_results),score:Number(body.score),total:Number(body.total),topic:body.topic||'Granja',user_id:1,created_at:new Date().toISOString()});saveLocal();return {ok:true}}
  if(url==='/api/register'&&method==='POST')return {ok:true};
  return {};
}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

async function loadDashboard(){const d=await api('/api/dashboard');$('#dashboard').innerHTML=`<div class="hero"><div><div class="eyebrow" style="color:#c9efdc">Panel principal</div><h2>¡Hola, ${state.user.name.split(' ')[0]}! 👋</h2><p>Usa la plataforma para aprender y registrar lo que ocurre en la granja. Los valores de referencia están identificados y pueden ser reemplazados por el profesor.</p></div><div class="hero-art">🐔 🐟 🌱</div></div><div class="grid cards"><div class="card metric-card accent"><div class="metric-icon">📅</div><div class="metric">${d.tasks}</div><div class="metric-label">Tareas pendientes</div></div><div class="card metric-card accent blue"><div class="metric-icon">🌾</div><div class="metric">${fmtGram(d.feedToday)}</div><div class="metric-label">Alimento registrado hoy</div></div><div class="card metric-card accent yellow"><div class="metric-icon">💵</div><div class="metric">${fmtMoney(d.income)}</div><div class="metric-label">Ingresos registrados</div></div><div class="card metric-card accent red"><div class="metric-icon">📊</div><div class="metric">${fmtMoney(d.profit)}</div><div class="metric-label">Resultado neto</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-head"><div><h2>Accesos rápidos</h2><div class="muted">Lo más usado en la jornada.</div></div></div><div class="quick"><button onclick="show('feeding')">🌾 Registrar alimento</button><button onclick="show('tasks')">📅 Ver tareas</button><button onclick="show('growth')">⚖️ Registrar peso</button><button onclick="show('calculator')">🧮 Calcular</button><button onclick="show('health')">🩺 Revisar signos</button></div></div><div class="card"><h2>📚 Datos de referencia</h2><p class="muted">Son valores técnicos para aprendizaje. No son datos medidos en tu granja.</p><div class="ref-grid"><div class="ref-card"><h4>🐔 Pollos</h4><div class="ref-value">10–120 g/día</div><div class="small">según etapa de referencia</div></div><div class="ref-card"><h4> function renderCalculator(){const settingsP=state.settings.find(x=>x.animal==='pollo'),settingsF=state.settings.find(x=>x.animal==='pez');$('#calculator').innerHTML=`<div class="grid two"><div class="card"><div class="section-head"><div><h2>🧮 Calculadora de alimento</h2><div class="muted">Todos los resultados de alimento se muestran en gramos.</div></div><span class="badge yellow">Referencia ≠ dato de la granja</span></div><div class="notice"><strong>Importante</strong>Las referencias son educativas. El profesor puede reemplazarlas por los parámetros reales de la granja desde Administración.</div><form id="calcFeedForm" class="form-grid" style="margin-top:14px"><div class="field"><label>Animal</label><select id="calAnimal"><option value="pollo">🐔 Pollo de engorde</option><option value="pez">🐟 Pez</option></select></div><div class="field"><label>Número de animales</label><input id="calCount" type="number" min="1" value="1" required></div><div class="field"><label>Peso promedio (g)</label><input id="calWeight" type="number" min="0.1" step="0.1" required></div><div class="field"><label>Edad / días de crianza</label><input id="calDays" type="number" min="0" value="30" required></div><button class="btn full">Calcular alimento</button></form><div id="calResult" style="margin-top:14px"></div></div><div class="card"><h2>📐 Calculadora matemática</h2><p class="muted">También puedes usarla como calculadora básica.</p><div class="field"><label>Operación</label><input id="math" placeholder="Ej: (25*4)/2+10"></div><button class="btn secondary" onclick="calcMath()" style="margin-top:10px">Resolver</button><div id="mathResult" class="metric"></div><hr><h3>Cómo se calcula</h3><div class="info small">🐔 Pollo: gramos por ave y por día según la etapa. 🐟 Pez: gramos por kg de biomasa y por día.</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>🐔 Referencia de pollos</h2><div class="table-wrap"><table class="table compact"><thead><tr><th>Días</th><th>g/ave/día</th></tr></thead><tbody>${refPoultry.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]} g</b></td></tr>`).join('')}</tbody></table></div><div class="source">Referencia de prueba basada en los datos proporcionados. El profesor debe validar el protocolo real de la granja.</div></div><div class="card"><h2>🐟 Referencia de peces</h2><div class="table-wrap"><table class="table compact"><thead><tr><th>Tamaño</th><th>Alimento diario</th></tr></thead><tbody>${refFish.map(r=>`<tr><td>${r[0]}</td><td><b>${r[1]}</b></td></tr>`).join('')}</tbody></table></div><p class="muted small">Para peces, la unidad de referencia es gramos de alimento por cada kg de peso vivo al día.</p><div class="source">Referencia de prueba basada en los datos proporcionados. No sustituye el protocolo del profesor.</div></div></div>`;$('#calcFeedForm').onsubmit=e=>{e.preventDefault();calcFeed()}}
function calcFeed(){const animal=$('#calAnimal').value,count=Number($('#calCount').value),w=Number($('#calWeight').value),days=Number($('#calDays').value);if(!count||w<=0)return $('#calResult').innerHTML='<div class="danger-note">Completa los datos.</div>';const s=state.settings.find(x=>x.animal===animal);let dailyPerAnimal=0,label='';if(s?.rate>0){if(animal==='pollo'){dailyPerAnimal=s.rate;label=`${fmtGram(dailyPerAnimal)} por pollo/día (parámetro del profesor)`;}else{dailyPerAnimal=(w/1000)*s.rate;label=`${fmtGram(dailyPerAnimal)} por pez/día (${s.rate} g/kg/día, parámetro del profesor)`;}}else if(animal==='pollo'){const range=refPoultry.find(r=>{const [a,b]=r[0].split('–').map(Number);return days>=a&&days<=b});if(!range)return $('#calResult').innerHTML='<div class="danger-note">La edad está fuera de la tabla de referencia.</div>';const parts=range[1].split('–').map(Number);dailyPerAnimal=parts.length===2?((parts[0]+parts[1])/2):parts[0];label=`${fmtGram(dailyPerAnimal)} por pollo/día (promedio del rango ${range[1]} g)`;}else{const rate=w<300?0.09:0.0175;dailyPerAnimal=(w/1000)*rate*1000;label=`${fmtGram(dailyPerAnimal)} por pez/día (referencia de prueba)`;}const total=dailyPerAnimal*count;const p=s?.slot_morning??.4,n=s?.slot_noon??.3,a=s?.slot_afternoon??.3;$('#calResult').innerHTML=`<div class="card" style="box-shadow:none;background:var(--mint)"><div class="small muted">Resultado en gramos</div><div class="metric">${fmtGram(total)}</div><div><b>Alimento diario total</b></div><div style="margin-top:8px">${label} · grupo de ${count}</div><div class="ref-grid" style="margin-top:12px"><div class="ref-card"><h4>🌅 Mañana</h4><div class="ref-value">${fmtGram(total*p)}</div></div><div class="ref-card"><h4>☀️ Mediodía</h4><div class="ref-value">${fmtGram(total*n)}</div></div><div class="ref-card"><h4>🌆 Tarde</h4><div class="ref-value">${fmtGram(total*a)}</div></div></div><div class="small muted" style="margin-top:10px">Distribución configurada: ${(p*100).toFixed(0)} % mañana · ${(n*100).toFixed(0)} % mediodía · ${(a*100).toFixed(0)} % tarde.</div></div>`}

function calcMath(){try{const x=$('#math').value.replace(/[^0-9+\-*/().% ]/g,'');if(!x)return $('#mathResult').textContent='';const v=Function('"use strict";return ('+x+')')();$('#mathResult').textContent=Number.isFinite(v)?v:'Resultado no válido';}catch{$('#mathResult').textContent='Operación no válida'}}
async function loadTasks(){const data=await api('/api/tasks');state.tasks=data;const students=state.users?.length?state.users:await api('/api/users').catch(()=>[]);const admin=state.user.role==='admin';$('#tasks').innerHTML=`<div class="card">${admin?`<div class="section-head"><div><h2>➕ Crear tarea</h2><div class="muted">Asigna actividades a estudiantes.</div></div></div><form id="taskForm" class="form-grid"><div class="field"><label>Tarea</label><input id="taskTitle" required placeholder="Ej: Alimentar pollos"></div><div class="field"><label>Fecha</label><input id="taskDate" type="date" value="${today()}" required></div><div class="field"><label>Estudiante</label><select id="taskUser"><option value="">Sin asignar</option>${students.filter(x=>x.role==='student').map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div><div class="field"><label>Descripción</label><input id="taskDesc" placeholder="Detalle de la actividad"></div><button class="btn full">Crear tarea</button></form><hr>`:''}<div class="section-head"><div><h2>📅 Cronograma</h2><div class="muted">Todas las personas autorizadas pueden consultar las tareas.</div></div></div>${data.length?`<div class="timeline">${data.map(t=>`<div class="timeline-item"><div class="date-pill">${t.task_date}</div><div class="timeline-body"><strong>${t.title}</strong><div class="small muted">${t.description||'Sin descripción'} · ${t.assigned_name?`Asignada a ${t.assigned_name}`:'Sin asignar'}</div><div class="btn-row"><span class="badge ${t.status==='completed'?'blue':'yellow'}">${t.status==='completed'?'✓ Completada':'Pendiente'}</span>${t.status!=='completed'?`<button class="btn secondary" onclick="completeTask(${t.id})">Marcar realizada</button>`:''}${admin?`<button class="btn danger" onclick="deleteTask(${t.id})">Eliminar</button>`:''}</div></div></div>`).join('')}</div>`:'<div class="empty">No hay tareas registradas todavía.</div>'}</div>`;if($('#taskForm'))$('#taskForm').onsubmit=async e=>{e.preventDefault();await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('#taskTitle').value,description:$('#taskDesc').value,assigned_to:$('#taskUser').value||null,task_date:$('#taskDate').value})});loadTasks();loadDashboard()}}
async function completeTask(id){await api('/api/tasks/'+id+'/complete',{method:'PATCH'});loadTasks();loadDashboard()};async function deleteTask(id){if(confirm('¿Eliminar esta tarea?')){await api('/api/tasks/'+id,{method:'DELETE'});loadTasks();loadDashboard()}}
async function loadFeed(){state.feedings=await api('/api/feedings');const total=state.feedings.filter(x=>x.feeding_date===today()).reduce((a,x)=>a+Number(x.amount),0);$('#feeding').innerHTML=`<div class="grid two"><div class="card"><div class="section-head"><div><h2>🌾 Registrar alimentación</h2><div class="muted">Registra lo que realmente se suministró.</div></div><span class="badge">Hoy: ${total.toFixed(2)}</span></div><form id="feedForm" class="form-grid"><div class="field"><label>Animal</label><select id="feedAnimal"><option value="pollo">🐔 Pollo</option><option value="pez">🐟 Pez</option></select></div><div class="field"><label>Fecha</label><input id="feedDate" type="date" value="${today()}" required></div><div class="field"><label>Horario</label><select id="feedSlot"><option value="morning">Mañana</option><option value="noon">Mediodía</option><option value="afternoon">Tarde</option></select></div><div class="field"><label>Cantidad suministrada (g)</label><input id="feedAmount" type="number" min="0.01" step="0.01" required></div><button class="btn full">Guardar registro</button></form><div class="info small" style="margin-top:12px">Registrar por horario ayuda a revisar cómo se distribuyó la cantidad diaria.</div></div><div class="card"><h2>📊 Resumen de hoy</h2>${['morning','noon','afternoon'].map(s=>{const v=state.feedings.filter(x=>x.feeding_date===today()&&x.slot===s).reduce((a,x)=>a+Number(x.amount),0);return `<div style="margin:14px 0"><div style="display:flex;justify-content:space-between"><b>${slotName(s)}</b><span>${v.toFixed(2)} g</span></div><div style="height:9px;background:#edf2ee;border-radius:99px;margin-top:6px"><div style="height:100%;width:${Math.min(v/Math.max(total,1)*100,100)}%;background:var(--green);border-radius:99px"></div></div></div>`}).join('')}</div></div><div class="card" style="margin-top:16px"><h2>Historial</h2>${state.feedings.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Animal</th><th>Horario</th><th>Cantidad</th><th>Responsable</th></tr></thead><tbody>${state.feedings.map(f=>`<tr><td>${f.feeding_date}</td><td>${animalName(f.animal)}</td><td>${slotName(f.slot)}</td><td>${Number(f.amount).toFixed(2)} g</td><td>${f.student_name||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay registros.</div>'}</div>`;$('#feedForm').onsubmit=async e=>{e.preventDefault();await api('/api/feedings',{method:'POST',body:JSON.stringify({animal:$('#feedAnimal').value,feeding_date:$('#feedDate').value,slot:$('#feedSlot').value,amount:$('#feedAmount').value})});loadFeed();loadDashboard()}}
async function loadWeights(){state.weights=await api('/api/weights');$('#growth').innerHTML=`<div class="grid two"><div class="card"><h2>📈 Registrar pesaje</h2><p class="muted">La estimación futura se mantiene separada de los datos reales registrados.</p><form id="growthForm" class="form-grid"><div class="field"><label>Animal</label><select id="gAnimal"><option value="pollo">🐔 Pollo</option><option value="pez">🐟 Pez</option></select></div><div class="field"><label>Días de crianza</label><input id="gDays" type="number" min="0" required></div><div class="field"><label>Peso inicial (g)</label><input id="gInitial" type="number" min="0.1" step="0.1" required></div><div class="field"><label>Peso actual (g)</label><input id="gCurrent" type="number" min="0" step="0.1"></div><div class="field"><label>Alimento suministrado (g)</label><input id="gFeed" type="number" min="0" step="0.1"></div><button class="btn full">Guardar y calcular</button></form><div id="growthResult" style="margin-top:12px"></div></div><div class="card"><h2>🔎 ¿Qué calcula?</h2><div class="ref-grid"><div class="ref-card"><h4>Peso ganado</h4><div class="ref-value">Actual − inicial</div></div><div class="ref-card"><h4>Crecimiento diario</h4><div class="ref-value">Ganancia ÷ días</div></div><div class="ref-card"><h4>Futuro</h4><div class="ref-value">Parametrizable</div></div></div><div class="notice" style="margin-top:12px">La predicción futura requiere parámetros reales de la granja. No se presenta una cifra inventada como si fuera un objetivo productivo.</div></div></div><div class="card" style="margin-top:16px"><h2>Historial de pesos</h2>${state.weights.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Animal</th><th>Días</th><th>Inicial</th><th>Actual</th><th>Ganancia</th><th>Promedio/día</th><th>Responsable</th></tr></thead><tbody>${state.weights.map(w=>{const diff=w.current_weight!=null?w.current_weight-w.initial_weight:null;return `<tr><td>${animalName(w.animal)}</td><td>${w.days}</td><td>${fmtGram(w.initial_weight)}</td><td>${w.current_weight!=null?fmtGram(w.current_weight):'—'}</td><td>${diff!=null?fmtGram(diff):'—'}</td><td>${diff!=null&&w.days>0?fmtGram(diff/w.days)+'/día':'—'}</td><td>${w.student_name||'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No hay pesajes registrados.</div>'}</div>`;$('#growthForm').onsubmit=async e=>{e.preventDefault();const days=Number($('#gDays').value),initial=Number($('#gInitial').value),current=Number($('#gCurrent').value||0);await api('/api/weights',{method:'POST',body:JSON.stringify({animal:$('#gAnimal').value,days,initial_weight:initial,current_weight:current||null,feed_amount:Number($('#gFeed').value||0)})});const diff=current?current-initial:null;$('#growthResult').innerHTML=current&&days?`<div class="success"><b>Ganancia:</b> ${fmtGram(diff)} · <b>Promedio:</b> ${fmtGram(diff/days)}/día. <br><span class="small">Estimación futura: pendiente de parámetros reales de la granja.</span></div>`:'<div class="success">Registro guardado. Agrega peso actual y días para calcular crecimiento.</div>';loadWeights()}}
function renderHealth(){$('#health').innerHTML=`<div class="danger-note"><b>⚠️ Herramienta educativa y orientativa</b><br>Seleccionar síntomas no permite diagnosticar una enfermedad. Ante signos graves, mortalidad inusual o cambios importantes, informa al responsable de la granja y solicita valoración veterinaria o sanitaria.</div><div class="grid two" style="margin-top:16px"><div class="card"><h2>🐔 Pollos</h2><div class="field"><label>Selecciona signos observados</label><select id="chickenSymptoms" multiple size="8"><option>Tos / estornudos</option><option>Dificultad respiratoria</option><option>Moco nasal o en pico</option><option>Diarrea</option><option>Decaimiento</option><option>Plumas erizadas</option><option>Temblores / incoordinación</option><option>Mortalidad inusual o repentina</option></select></div><button class="btn" onclick="healthCheck('pollo')" style="margin-top:12px">Ver orientación</button><div id="healthChickenResult" style="margin-top:12px"></div></div><div class="card"><h2>🐟 Tilapia</h2><div class="field"><label>Selecciona signos observados</label><select id="fishSymptoms" multiple size="8"><option>Pérdida de apetito</option><option>Natación anormal</option><option>Lesiones</option><option>Cambios en branquias</option><option>Cambios en ojos</option><option>Debilidad</option><option>Mortalidad inusual</option><option>Cambios de comportamiento</option></select></div><button class="btn blue" onclick="healthCheck('pez')" style="margin-top:12px">Ver orientación</button><div id="healthFishResult" style="margin-top:12px"></div></div></div><div class="card" style="margin-top:16px"><h2>🛡️ Prevención y bioseguridad</h2><div class="health-grid"><div class="health-card"><h3>Aves</h3><div class="check-list"><div class="check">Evitar contacto con aves silvestres.</div><div class="check">Limpiar y desinfectar instalaciones y equipos.</div><div class="check">Controlar el acceso de personas y vehículos.</div><div class="check">No manipular aves enfermas o muertas sin protección.</div></div></div><div class="health-card"><h3>Tilapia</h3><div class="check-list"><div class="check">Vigilar calidad del agua y comportamiento.</div><div class="check">Evitar sobrepoblación y acumulación de materia orgánica.</div><div class="check">Registrar mortalidades y cambios de forma temprana.</div><div class="check">Avisar al responsable ante signos inusuales.</div></div></div></div><p class="source">Fuente sanitaria: ICA. En Colombia se vigilan enfermedades aviares y acuícolas de importancia.</p></div>`}
function healthCheck(animal){const id=animal==='pollo'?'chickenSymptoms':'fishSymptoms',out=animal==='pollo'?'healthChickenResult':'healthFishResult';const s=[...$('#'+id).selectedOptions].map(x=>x.value);let extra='';if(animal==='pollo'&&s.some(x=>x.includes('Mortalidad')||x.includes('Dificultad')||x.includes('Temblores')))extra='<div class="danger-note" style="margin-top:10px"><b>Señal de alerta:</b> el ICA considera varios de estos signos como señales que deben notificarse o evaluarse oportunamente. Informa al responsable y evita manipular animales enfermos o muertos.</div>';if(animal==='pez'&&s.some(x=>x.includes('Mortalidad')))extra='<div class="danger-note" style="margin-top:10px"><b>Señal de alerta:</b> una mortalidad inusual requiere revisión sanitaria y del agua. Informa al responsable.</div>';$('#'+out).innerHTML=`<div class="info"><b>Orientación:</b> los signos seleccionados pueden tener múltiples causas. Revisa manejo, agua/ambiente y registros; no concluyas una enfermedad solo por estos signos.</div>${extra}<div class="small muted" style="margin-top:8px">Seleccionados: ${s.length?s.join(', '):'ninguno'}.</div>`}
function renderNotes(){$('#notes').innerHTML=`<div class="grid two"><div class="card"><h2>📷 Apuntes</h2><p class="muted">Sube una fotografía para dejar preparada la integración OCR/IA. La versión local no finge tener una API de IA conectada.</p><form id="ocrForm"><div class="field"><label>Fotografía de apuntes</label><input id="noteImage" type="file" accept="image/*" required></div><button class="btn" style="margin-top:10px">Procesar / preparar OCR</button></form><div id="ocrResult" style="margin-top:12px"></div><hr><div class="field"><label>También puedes pegar el texto de tus apuntes</label><textarea id="noteText" placeholder="Pega aquí tus apuntes para estudiarlos..."></textarea></div><button class="btn secondary" onclick="summarizeText()">Generar resumen básico</button><div id="summaryResult" style="margin-top:10px"></div></div><div class="card"><div class="section-head"><div><h2>🧠 Quiz de la granja</h2><div class="muted">Preguntas educativas basadas en los contenidos de la plataforma.</div></div><span class="badge blue">A · B · C</span></div><div id="quiz"></div></div></div>`;$('#ocrForm').onsubmit=async e=>{e.preventDefault();const f=$('#noteImage').files[0],fd=new FormData();fd.append('image',f);const r=await fetch('/api/notes/ocr',{method:'POST',body:fd});const d=await r.json();$('#ocrResult').innerHTML=`<div class="notice">${d.message}</div>`};renderQuiz()}
function summarizeText(){const t=$('#noteText').value.trim();if(!t)return $('#summaryResult').innerHTML='<div class="notice">Primero escribe o pega tus apuntes.</div>';const sentences=t.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);const summary=sentences.slice(0,Math.min(3,sentences.length)).join('. ')+(sentences.length>3?'…':'');$('#summaryResult').innerHTML=`<div class="success"><b>Resumen básico:</b><br>${summary}</div>`}
function renderQuiz(){const qs=[{q:'En la tabla de referencia de pollos, ¿la cantidad de alimento es igual durante todas las etapas?',a:['Sí, siempre es la misma','No, cambia según la etapa','Solo depende del color del pollo'],c:1,e:'La tabla de referencia cambia los gramos por ave/día según el rango de días.'},{q:'Para calcular la biomasa de un grupo de peces usamos…',a:['Número de peces × peso promedio','Edad + temperatura','Precio × peso'],c:0,e:'La biomasa representa el peso total del grupo.'},{q:'¿Qué debe hacerse ante mortalidad inusual o signos graves?',a:['Ignorarlos','Cambiar la dieta sin registrar','Avisar al responsable y buscar valoración adecuada'],c:2,e:'Los signos graves requieren atención oportuna y no permiten un diagnóstico solo con la aplicación.'},{q:'¿Qué significa que un dato sea de referencia?',a:['Que es obligatorio para todas las granjas','Que sirve para aprender y debe adaptarse a los datos reales','Que no tiene fuente'],c:1,e:'La plataforma distingue referencias técnicas de los datos reales de la granja.'}];let html='';qs.forEach((x,i)=>{html+='<div class="quiz-q"><b>'+(i+1)+'. '+x.q+'</b>';x.a.forEach((a,j)=>{html+='<label class="quiz-opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+a+'</label>'});html+='<div id="exp'+i+'" class="small muted" style="display:none;margin-top:8px"></div></div>'});html+='<button class="btn" onclick="gradeQuiz()" style="margin-top:12px">Terminar quiz</button><div id="quizResult" class="metric"></div>';$('#quiz').innerHTML=html;window.currentQuiz=qs}
async function gradeQuiz(){let score=0;window.currentQuiz.forEach((x,i)=>{const v=Number(document.querySelector(`input[name=q${i}]:checked`)?.value);const ok=v===x.c;if(ok)score++;const el=$('#exp'+i);el.style.display='block';el.innerHTML=ok?`✅ Correcta. ${x.e}`:`❌ Incorrecta. ${x.e}`});$('#quizResult').textContent=`${score}/${window.currentQuiz.length} · ${Math.round(score/window.currentQuiz.length*100)}%`;await api('/api/quiz-results',{method:'POST',body:JSON.stringify({score,total:window.currentQuiz.length,topic:'Granja Informativa'})})}
async function loadGuides(){state.guides=await api('/api/guides');$('#guides').innerHTML=`<div class="card"><div class="section-head"><div><h2>🔧 Guías de la granja</h2><div class="muted">Pasos sencillos para utilizar equipos y registrar mediciones.</div></div></div><div class="grid two">${state.guides.map(g=>`<details class="guide"><summary>${g.name}</summary><div class="guide-content"><p><b>¿Para qué sirve?</b><br>${g.purpose}</p><p><b>Materiales:</b><br>${g.materials}</p><p><b>Pasos:</b><br>${g.steps.replaceAll('\n','<br>')}</p><p><b>Seguridad:</b><br>${g.safety}</p><p><b>Errores comunes:</b><br>${g.errors}</p></div></details>`).join('')}</div><div class="info" style="margin-top:16px">💡 El administrador puede agregar nuevos dispositivos desde la configuración del proyecto.</div></div>`}
function renderSales(){$('#sales').innerHTML=`<div class="grid two"><div class="card"><h2>🐔 Calculadora de precio de venta</h2><p class="muted">Fórmula educativa: peso en libras × precio por libra.</p><div class="form-grid"><div class="field"><label>Peso (lb)</label><input id="saleWeight" type="number" min="0" step="0.01"></div><div class="field"><label>Precio por libra ($)</label><input id="salePrice" type="number" min="0" step="1"></div></div><button class="btn" onclick="saleCalc()" style="margin-top:12px">Calcular total</button><div id="saleResult" class="metric"></div><div class="notice small" style="margin-top:14px">No se carga un precio real automáticamente. El valor debe corresponder al mercado o al precio que determine la granja.</div></div><div class="card"><h2>📚 Referencia de mercado</h2><p class="muted">La plataforma puede recibir posteriormente precios locales de Solita/Caquetá o de la fuente que indique el profesor.</p><div class="ref-card"><h4>Precio de referencia</h4><div class="ref-value">Configurable</div><p class="small muted">No se presenta un precio nacional como si fuera el precio de venta de la granja.</p></div></div></div>`}
function saleCalc(){const w=Number($('#saleWeight').value),p=Number($('#salePrice').value),r=w*p;$('#saleResult').textContent=w>0&&p>0?fmtMoney(r):'Completa ambos valores.'}
async function loadFinance(){state.financial=await api('/api/financial');const income=state.financial.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.value),0),expense=state.financial.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.value),0);const months={};state.financial.forEach(x=>{const m=x.date.slice(0,7);months[m]??={income:0,expense:0};months[m][x.type==='income'?'income':'expense']+=Number(x.value)});const vals=Object.entries(months).slice(-8),max=Math.max(1,...vals.flatMap(([_,v])=>[v.income,v.expense]));$('#finance').innerHTML=`<div class="grid cards"><div class="card metric-card accent"><div class="metric">${fmtMoney(expense)}</div><div class="metric-label">Total gastos</div></div><div class="card metric-card accent blue"><div class="metric">${fmtMoney(income)}</div><div class="metric-label">Total ingresos</div></div><div class="card metric-card accent yellow"><div class="metric">${fmtMoney(income-expense)}</div><div class="metric-label">Ganancia neta</div></div><div class="card metric-card accent red"><div class="metric">${state.financial.length}</div><div class="metric-label">Movimientos registrados</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>➕ Registrar movimiento</h2><form id="financeForm" class="form-grid"><div class="field"><label>Tipo</label><select id="finType"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></div><div class="field"><label>Categoría</label><select id="finCategory"><option>Alimento</option><option>Animales</option><option>Materiales</option><option>Transporte</option><option>Productos autorizados</option><option>Agua</option><option>Electricidad</option><option>Venta de pollo</option><option>Venta de pescado</option><option>Otros</option></select></div><div class="field"><label>Fecha</label><input id="finDate" type="date" value="${today()}" required></div><div class="field"><label>Valor ($)</label><input id="finValue" type="number" min="0.01" step="1" required></div><div class="field full"><label>Descripción</label><input id="finDesc" placeholder="Ej: compra de alimento"></div><button class="btn full">Guardar movimiento</button></form></div><div class="card"><h2>📊 Resumen mensual</h2>${vals.length?`<div class="bar-chart">${vals.map(([m,v])=>`<div class="bar-item"><div class="bar-num">${fmtMoney(v.income+v.expense)}</div><div class="bar" style="height:${Math.max(4,(v.income+v.expense)/max*150)}px"></div><div class="bar-label">${m.slice(5)}</div></div>`).join('')}</div><div class="small muted">Altura = movimiento total del mes.</div>`:'<div class="empty">Registra movimientos para ver la gráfica.</div>'}</div></div><div class="card" style="margin-top:16px"><h2>Historial financiero</h2>${state.financial.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Valor</th><th></th></tr></thead><tbody>${state.financial.map(f=>`<tr><td>${f.date}</td><td><span class="badge ${f.type==='income'?'blue':'red'}">${f.type==='income'?'Ingreso':'Gasto'}</span></td><td>${f.category}</td><td>${f.description}</td><td>${fmtMoney(f.value)}</td><td>${state.user.role==='admin'?`<button class="btn danger" onclick="delFin(${f.id})">Eliminar</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay movimientos.</div>'}</div>`;$('#financeForm').onsubmit=async e=>{e.preventDefault();await api('/api/financial',{method:'POST',body:JSON.stringify({type:$('#finType').value,category:$('#finCategory').value,date:$('#finDate').value,value:$('#finValue').value,description:$('#finDesc').value})});loadFinance();loadDashboard()}}
async function delFin(id){if(confirm('¿Eliminar movimiento?')){await api('/api/financial/'+id,{method:'DELETE'});loadFinance();loadDashboard()}}
function renderProfile(){$('#profile').innerHTML=`<div class="grid two"><div class="card"><h2>👤 Tu perfil</h2><div class="ref-grid"><div class="ref-card"><h4>Nombre</h4><div>${state.user.name}</div></div><div class="ref-card"><h4>Correo</h4><div class="small">${state.user.email}</div></div><div class="ref-card"><h4>Rol</h4><div>${state.user.role==='admin'?'Profesor / Administrador':'Estudiante'}</div></div></div></div><div class="card"><h2>🔐 Seguridad</h2><p class="muted">La plataforma usa sesiones y las contraseñas se almacenan mediante hash en el servidor; no se muestran en texto visible.</p><div class="success">Recuerda cerrar sesión si utilizas un computador compartido.</div></div></div>`}
async function loadAdmin(){if(state.user.role!=='admin')return;state.users=await api('/api/users');state.settings=await api('/api/settings');$('#admin').innerHTML=`<div class="grid two"><div class="card"><h2>👥 Estudiantes</h2><div class="table-wrap"><table class="table compact"><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th></tr></thead><tbody>${state.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role==='admin'?'Profesor':'Estudiante'}</td></tr>`).join('')}</tbody></table></div><hr><h3>Crear estudiante</h3><form id="newStudent" class="form-grid"><div class="field"><label>Nombre</label><input id="nsName" required></div><div class="field"><label>Correo</label><input id="nsEmail" type="email" required></div><div class="field"><label>Contraseña</label><input id="nsPass" type="password" minlength="6" required></div><button class="btn full">Crear estudiante</button></form></div><div class="card"><h2>⚙️ Parámetros de alimentación</h2><p class="muted">Configura los valores en gramos. Para pollo: gramos por ave/día. Para pez: gramos de alimento por kg de peso vivo/día. Si está en 0, se usa la referencia de prueba.</p>${state.settings.map(s=>`<form class="settingForm card" data-animal="${s.animal}" style="padding:14px;margin:10px 0;background:var(--mint);box-shadow:none"><h3>${animalName(s.animal)}</h3><div class="info small">${s.animal==='pollo'?'Ejemplo de prueba: 12–22 g por ave/día en la primera semana.':'Ejemplo de prueba: 80–100 g/kg/día para alevines pequeños; 15–20 g/kg/día para peces de más de 300 g.'}</div><div class="form-grid"><div class="field"><label>${s.animal==='pollo'?'Alimento por pollo (g/ave/día)':'Alimento por kg de pez (g/kg/día)'}</label><input name="rate" type="number" min="0" step="0.1" value="${s.rate}"></div><div class="field"><label>Distribución mañana (0–1)</label><input name="slot_morning" type="number" min="0" max="1" step="0.01" value="${s.slot_morning}"></div><div class="field"><label>Distribución mediodía (0–1)</label><input name="slot_noon" type="number" min="0" max="1" step="0.01" value="${s.slot_noon}"></div><div class="field"><label>Distribución tarde (0–1)</label><input name="slot_afternoon" type="number" min="0" max="1" step="0.01" value="${s.slot_afternoon}"></div></div><button class="btn" style="margin-top:10px">Guardar</button></form>`).join('')}</div></div><div class="card" style="margin-top:16px"><h2>📚 Fuentes y datos de referencia</h2><div class="ref-grid"><div class="ref-card"><h4>🐔 Pollos</h4><p class="small">FAO: tabla educativa de gramos por ave/día según etapa.</p><b>10–120 g/ave/día</b></div><div class="ref-card"><h4>🐟 Tilapia</h4><p class="small">FAO: alimentación como porcentaje de biomasa, variable según tamaño.</p><b>4–6 % en peces pequeños</b></div><div class="ref-card"><h4>🩺 Sanidad</h4><p class="small">ICA: signos de alerta y bioseguridad aviar; sanidad acuícola en Colombia.</p><b>Orientativo</b></div></div><p class="footer-note">Antes de usar estos valores como protocolo de producción, el profesor debe revisar y adaptar los parámetros a la granja escolar.</p></div>`;$$('.settingForm').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));await api('/api/settings/'+f.dataset.animal,{method:'PUT',body:JSON.stringify(o)});state.settings=await api('/api/settings');alert('Parámetros guardados.');renderCalculator()});$('#newStudent').onsubmit=async e=>{e.preventDefault();try{await api('/api/register',{method:'POST',body:JSON.stringify({name:$('#nsName').value,email:$('#nsEmail').value,password:$('#nsPass').value})});alert('Estudiante creado.');loadAdmin()}catch(err){alert(err.message)}}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
state.user={id:1,name:'Usuario de la granja',email:'usuario@granja.local',role:'admin'}; renderApp();
</script></body></html>
